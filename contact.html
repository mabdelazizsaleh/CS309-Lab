<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact ttl</title>
    <link rel="stylesheet" href="css/Stylesheet.css">
</head>
<body>
    <header>
        <h1>contact page</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>
    <form>

        <label>Name:</label>
        <input type="text" name="name">

        <br>

        <label>Email:</label>
        <input type="email" name="email">

        <br>

        <label>Phone Number:</label>
        <input type="number" name="phone">

        <br>

        <label>Date:</label>
        <input type="date" name="date">

        <br>

        <label>Radio Buttons:</label>
        <input type="radio" name="radiob" value="b1"> 1
        <input type="radio" name="radiob" value="b2"> 2

        <br>

        <label>Checkboxes:</label>
        <br>
        <input type="checkbox" name="checkb" value="b1"> 1
        <input type="checkbox" name="checkb" value="b2"> 2
        <input type="checkbox" name="checkb" value="b3"> 3

        <br>

        <label>Dropdown Menu:</label>

        <select name="source">
            <option value="b1">1</option>
            <option value="b2">2</option>
            <option value="b3">3</option>
            <option value="b4">4</option>
        </select>

        <br>

        <label>Large Textbox:</label>
        <br>
        <textarea name="textbox" rows="6" cols="60"></textarea>

        <br>

    </form>

</body>
</html>
